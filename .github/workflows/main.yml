name: Build Native Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Capacitor & Dependencies
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor-community/bluetooth-le

      - name: Initialize Capacitor Android Platform
        run: |
          npx cap init EiotHack com.eiothack.app --web-dir .
          npx cap add android
          cp AndroidManifest.xml android/app/src/main/AndroidManifest.xml || true
          npx cap sync android

      - name: Build Native Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Native EiotHack APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: EiotHack-Native-Bluetooth-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
