name: Build Native Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Initialize Package JSON & Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: Add Android Platform
        run: |
          npx cap init EiotHack com.eiothack.app --web-dir .
          npx cap add android || true
          cp AndroidManifest.xml android/app/src/main/AndroidManifest.xml || true
          npx cap sync android

      - name: Build Native Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Native EiotHack APK
        uses: actions/upload-artifact@v4
        with:
          name: EiotHack-Native-Bluetooth-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
